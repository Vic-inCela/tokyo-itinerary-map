<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>東京五日遊 · 路線圖行程</title>
<meta name="theme-color" content="#e9edf2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="東京五日遊">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* --- surfaces: cool porcelain, not cream --- */
    --paper:#e9edf2;
    --surface:#ffffff;
    --wash:#f4f6f9;
    --ink:#16202e;
    --ink-2:#5d6b7e;
    --ink-3:#8b97a7;
    --hair:rgba(22,32,46,.10);
    --hair-2:rgba(22,32,46,.06);
    --shadow-s:0 1px 2px rgba(16,26,40,.06), 0 4px 10px -6px rgba(16,26,40,.18);
    --shadow-m:0 2px 4px rgba(16,26,40,.05), 0 14px 30px -14px rgba(16,26,40,.28);
    --shadow-l:0 -2px 6px rgba(16,26,40,.04), 0 -18px 44px -18px rgba(16,26,40,.26);

    /* --- line colours, tuned for light ground --- */
    --d1:#e0761a;
    --d2:#00808f;
    --d3:#2f8b52;
    --d4:#c2317b;
    --d5:#5157c4;
    --accent:var(--d1);

    --font-ui:"Zen Kaku Gothic New","Noto Sans TC","Hiragino Sans",sans-serif;
    --font-body:"Noto Sans TC","Zen Kaku Gothic New",sans-serif;
    --font-mono:"DM Mono","Noto Sans TC",ui-monospace,monospace;

    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --panel-w:420px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    overflow:hidden;overscroll-behavior:none;
    background:var(--paper);color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}

  /* ================= map ================= */
  /* Maps JS (v3.53+) stamps inline position:relative on the container,
     so size must not depend on position:fixed + inset */
  #mapDiv{position:fixed;inset:0;z-index:1;background:var(--paper);width:100%;height:100dvh;}
  .via-dot{
    width:9px;height:9px;border-radius:50%;
    background:#ffffff;border:2.5px solid var(--c,var(--accent));
    box-shadow:0 1px 3px rgba(16,26,40,.35);
  }

  .pin{
    position:relative;width:34px;height:34px;border-radius:50%;
    background:var(--surface);border:2px solid var(--mc,var(--accent));
    display:grid;place-items:center;cursor:pointer;
    box-shadow:0 3px 9px -3px rgba(16,26,40,.4);
    transition:transform .22s cubic-bezier(.2,.9,.3,1.2),background .22s;
  }
  .pin .emo{font-size:15px;line-height:1;filter:saturate(1.05);}
  .pin .num{
    position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;
    border-radius:9px;background:var(--mc,var(--accent));color:#fff;
    font-family:var(--font-mono);font-size:10px;font-weight:500;
    display:grid;place-items:center;border:1.5px solid var(--surface);
  }
  .pin.is-active{transform:scale(1.2);box-shadow:0 9px 20px -6px rgba(16,26,40,.5);}
  .pin.is-active::after{
    content:"";position:absolute;inset:-7px;border-radius:50%;
    border:1.5px solid var(--mc,var(--accent));opacity:.35;
  }

  /* ================= top signage board ================= */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:20;
    padding:calc(var(--safe-t) + 12px) 0 14px;
    background:linear-gradient(180deg,rgba(233,237,242,.97) 0%,rgba(233,237,242,.92) 46%,rgba(233,237,242,0) 100%);
  }
  .topbar-row{display:flex;align-items:center;gap:10px;padding:0 14px 11px;}
  .brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1;}
  .brand-mark{
    flex:none;width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;
    font-family:var(--font-ui);font-weight:700;font-size:12px;letter-spacing:.02em;
    display:grid;place-items:center;box-shadow:var(--shadow-s);
  }
  .brand-t{font-family:var(--font-ui);font-weight:700;font-size:14px;line-height:1.2;}
  .brand-d{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-2);margin-top:2px;letter-spacing:-.01em;}
  .ghost-btn{
    flex:none;width:36px;height:36px;border-radius:50%;background:var(--surface);
    border:1px solid var(--hair);color:var(--ink-2);
    display:grid;place-items:center;box-shadow:var(--shadow-s);transition:color .2s,transform .2s;
  }
  .ghost-btn svg{width:17px;height:17px;}
  .ghost-btn:hover{color:var(--ink);}
  .ghost-btn:active{transform:scale(.94);}
  .tz-btn{
    flex:none;height:36px;padding:0 12px;border-radius:18px;background:var(--surface);
    border:1px solid var(--hair);color:var(--ink-2);box-shadow:var(--shadow-s);
    font-family:var(--font-ui);font-weight:700;font-size:12px;white-space:nowrap;
    transition:color .2s,transform .2s;
  }
  .tz-btn:hover{color:var(--ink);}
  .tz-btn:active{transform:scale(.96);}
  .tzTW{font-style:normal;}
  .tconv{border-bottom:1px dotted var(--ink-3);cursor:help;}

  /* ---- signature: the day switcher is a rail line ---- */
  .rail{
    display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
    padding:2px 12px 2px;
  }
  .rail::-webkit-scrollbar{display:none;}
  .station{
    position:relative;flex:none;min-width:70px;padding:16px 2px 2px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .station .seg{position:absolute;top:22px;height:2.5px;background:var(--c);opacity:.3;border-radius:2px;}
  .station .seg.l{left:0;right:50%;}
  .station .seg.r{left:50%;right:0;}
  .station.is-first .seg.l,.station.is-last .seg.r{display:none;}
  .station .dot{
    position:relative;z-index:1;width:27px;height:27px;border-radius:50%;
    background:var(--surface);border:2.5px solid var(--c);color:var(--ink);
    font-family:var(--font-mono);font-size:12px;font-weight:500;
    display:grid;place-items:center;
    transition:background .25s,color .25s,transform .25s cubic-bezier(.2,.9,.3,1.3);
  }
  .station .st-label{
    font-size:10.5px;color:var(--ink-3);white-space:nowrap;font-weight:500;
    transition:color .25s;
  }
  .station.is-active .dot{background:var(--c);color:#fff;transform:scale(1.14);box-shadow:0 4px 12px -3px color-mix(in srgb,var(--c) 55%,transparent);}
  .station.is-active .seg{opacity:.85;}
  .station.is-active .st-label{color:var(--c);font-weight:700;}
  .station:not(.is-active):hover .dot{transform:scale(1.08);}

  /* ---- OSM attribution chip (rail geometry is ODbL) ---- */
  .osm-credit{
    font-size:10px;line-height:1;color:var(--ink-2);
    background:rgba(255,255,255,.82);border-radius:4px;
    padding:3px 6px;margin:0 4px 2px 0;white-space:nowrap;
  }
  .osm-credit a{color:inherit;}

  /* ================= panel / bottom sheet ================= */
  .panel{
    position:fixed;left:0;right:0;bottom:0;z-index:30;height:200px;
    background:var(--surface);
    border-radius:26px 26px 0 0;
    box-shadow:var(--shadow-l);
    display:flex;flex-direction:column;overflow:hidden;
    transition:height .34s cubic-bezier(.22,.68,.35,1);
    touch-action:none;
  }
  .panel.dragging{transition:none;}
  .grip{flex:none;padding:9px 18px 13px;position:relative;cursor:grab;}
  .grip-bar{width:40px;height:4px;border-radius:3px;background:rgba(22,32,46,.16);margin:0 auto 12px;}
  .p-head{padding-right:42px;}
  .p-eyebrow{
    display:flex;align-items:center;gap:7px;
    font-family:var(--font-mono);font-size:11px;color:var(--accent);
    letter-spacing:.01em;transition:color .3s;
  }
  .p-eyebrow::before{content:"";width:14px;height:2.5px;border-radius:2px;background:var(--accent);flex:none;}
  .p-title{font-family:var(--font-ui);font-weight:700;font-size:19.5px;line-height:1.32;margin-top:6px;letter-spacing:-.01em;}
  .p-note{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-top:6px;}
  .snap-btn{
    position:absolute;top:24px;right:16px;width:32px;height:32px;border-radius:50%;
    background:var(--wash);border:1px solid var(--hair-2);color:var(--ink-2);
    display:grid;place-items:center;transition:transform .3s ease;
  }
  .snap-btn svg{width:14px;height:14px;}
  .snap-btn.up{transform:rotate(180deg);}
  .p-body{
    flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:2px 18px calc(26px + var(--safe-b));touch-action:pan-y;
  }

  /* ---- weather strip ---- */
  .weather{
    display:flex;align-items:center;gap:11px;padding:10px 13px;margin:2px 0 16px;
    background:var(--wash);border-radius:14px;font-size:11.5px;color:var(--ink-2);line-height:1.45;
  }
  .weather .wi{font-size:16px;flex:none;}
  .weather .wt{font-family:var(--font-mono);font-size:13px;color:var(--ink);font-weight:500;flex:none;}

  /* ---- timeline: cards on a rail ---- */
  .timeline{position:relative;}
  .stop{position:relative;display:flex;gap:13px;padding-bottom:10px;}
  .stop::before{
    content:"";position:absolute;left:12.5px;top:20px;bottom:-2px;width:2.5px;
    background:var(--c);opacity:.22;border-radius:2px;
  }
  .stop:last-child::before{display:none;}
  .stop-dot{
    position:relative;z-index:1;flex:none;width:27px;height:27px;margin-top:6px;border-radius:50%;
    background:var(--surface);border:2.5px solid var(--c);color:var(--c);
    font-family:var(--font-mono);font-size:11.5px;font-weight:500;
    display:grid;place-items:center;transition:background .25s,color .25s;
  }
  .stop-card{
    flex:1;min-width:0;background:var(--wash);border-radius:16px;
    padding:11px 14px 13px;cursor:pointer;
    transition:background .25s,box-shadow .25s,transform .25s;
  }
  .stop-card:hover{background:#eff2f6;}
  .stop.is-active .stop-dot{background:var(--c);color:#fff;}
  .stop.is-active .stop-card{background:var(--surface);box-shadow:0 0 0 1.5px var(--c) inset,var(--shadow-m);}
  .stop-time{font-family:var(--font-mono);font-size:11.5px;font-weight:500;color:var(--c);letter-spacing:-.01em;}
  .stop-title{font-family:var(--font-ui);font-weight:700;font-size:14.5px;line-height:1.35;margin:3px 0 4px;}
  .stop-desc{font-size:12.5px;color:var(--ink-2);line-height:1.65;}
  /* ---- transit legs ---- */
  .leg{display:flex;gap:13px;padding-bottom:10px;}
  .leg.is-clickable{cursor:pointer;border-radius:14px;transition:background .2s,box-shadow .2s;}
  .leg.is-clickable:hover{background:var(--wash);}
  .leg.is-active{background:var(--wash);box-shadow:0 0 0 1.5px var(--c) inset;}
  .leg-rail{flex:none;width:27px;display:flex;justify-content:center;align-items:stretch;}
  .leg-line{width:2.5px;border-radius:2px;background:var(--c);opacity:.9;}
  .leg.is-walk .leg-line{
    background:repeating-linear-gradient(180deg,var(--c) 0 3px,transparent 3px 8px);
    opacity:.75;border-radius:0;
  }
  .leg-body{flex:1;min-width:0;padding:5px 2px 7px;}
  .leg-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .leg-badge{
    flex:none;font-family:var(--font-mono);font-size:10.5px;font-weight:500;color:#fff;
    background:var(--c);border-radius:6px;padding:2.5px 7px;letter-spacing:-.01em;
  }
  .leg.is-walk .leg-badge{background:none;color:var(--c);font-size:14px;padding:0;}
  .leg-name{font-size:12.5px;font-weight:500;color:var(--ink);}
  .leg-meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);margin-top:6px;}
  .leg-via{font-size:11px;color:var(--ink-3);margin-top:4px;line-height:1.5;}
  .leg-note{
    font-size:11px;color:var(--ink-3);line-height:1.65;margin-top:7px;
    padding-left:9px;border-left:2px solid var(--hair);
  }

  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
  .tag{font-size:10.5px;padding:3.5px 9px;border-radius:999px;background:rgba(22,32,46,.055);color:var(--ink-2);}
  .maplink{
    display:inline-flex;align-items:center;gap:5px;margin-top:10px;
    font-size:11.5px;font-weight:500;color:var(--c);text-decoration:none;
    padding:5px 10px 5px 8px;border-radius:999px;border:1px solid currentColor;opacity:.9;
  }
  .maplink:hover{opacity:1;}
  .maplink svg{width:12px;height:12px;flex:none;}
  .stop-links{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .navlink{background:var(--c);border-color:transparent;color:#fff;}

  /* ---- overview ---- */
  .lines{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 14px;}
  .line-chip{
    display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-2);
    background:var(--wash);border-radius:999px;padding:5px 11px 5px 8px;
  }
  .line-chip i{width:14px;height:3.5px;border-radius:2px;flex:none;}
  .ov{
    display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:9px;
    background:var(--wash);border-radius:16px;cursor:pointer;transition:background .2s,transform .2s;
  }
  .ov:hover{background:#eff2f6;transform:translateX(2px);}
  .ov-dot{
    flex:none;width:29px;height:29px;border-radius:50%;background:var(--surface);
    border:2.5px solid var(--c);color:var(--c);
    font-family:var(--font-mono);font-size:12px;font-weight:500;display:grid;place-items:center;
  }
  .ov-day{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);}
  .ov-title{font-family:var(--font-ui);font-weight:700;font-size:13px;margin-top:2px;line-height:1.35;}

  /* ---- info sections ---- */
  .sec{margin:20px 0 9px;display:flex;align-items:center;gap:9px;}
  .sec:first-of-type{margin-top:2px;}
  .sec i{width:3px;height:15px;border-radius:2px;background:var(--accent);flex:none;transition:background .3s;}
  .sec h3{font-family:var(--font-ui);font-weight:700;font-size:14px;margin:0;}
  .info p,.info li{font-size:12.5px;color:var(--ink-2);line-height:1.7;margin:0 0 6px;}
  .info ol,.info ul{margin:0;padding-left:19px;}
  .info li{margin-bottom:5px;}
  .info li::marker{color:var(--ink-3);font-family:var(--font-mono);font-size:11px;}
  .facts{display:flex;flex-direction:column;gap:8px;}
  .fact{
    display:flex;align-items:baseline;gap:10px;background:var(--wash);border-radius:13px;
    padding:10px 13px;font-size:12px;color:var(--ink-2);
  }
  .fact .fk{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);flex:none;width:30px;}
  .fact b{color:var(--ink);font-weight:700;}
  .fact .fm{font-family:var(--font-mono);font-size:11px;}
  .slots{display:flex;flex-direction:column;gap:7px;margin-top:4px;}
  .slot{display:flex;align-items:center;gap:11px;background:var(--wash);border-radius:13px;padding:9px 13px;}
  .slot .sd{font-size:11.5px;font-weight:500;flex:none;width:74px;}
  .slot .sh{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);letter-spacing:-.01em;}
  table.fare{width:100%;border-collapse:collapse;margin-top:8px;font-size:11.5px;}
  table.fare th,table.fare td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--hair-2);color:var(--ink-2);}
  table.fare thead th{font-size:10px;color:var(--ink-3);font-family:var(--font-mono);font-weight:400;}
  table.fare td:not(:first-child){font-family:var(--font-mono);color:var(--ink);}
  .caution{
    margin-top:12px;padding:11px 13px;border-radius:13px;
    background:rgba(224,118,26,.07);font-size:11.5px;color:var(--ink-2);line-height:1.65;
  }

  /* ---- insurance: hotline + scenario cards ---- */
  .sos{
    display:flex;align-items:center;gap:12px;margin:2px 0 11px;padding:12px 14px;
    border-radius:15px;background:var(--ink);color:#fff;box-shadow:var(--shadow-s);
  }
  .sos:active{transform:scale(.99);}
  .sos .si{font-size:18px;line-height:1;flex:none;}
  .sos .sb{flex:1;min-width:0;}
  .sos b{display:block;font-family:var(--font-ui);font-size:12px;font-weight:700;margin-bottom:2px;}
  .sos i{font-family:var(--font-mono);font-size:14px;font-style:normal;letter-spacing:.01em;}
  .sos .sg{font-size:11px;opacity:.55;flex:none;}
  .case{background:var(--wash);border-radius:15px;padding:12px 14px;margin-bottom:9px;}
  .case-h{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
  .case-h .ci{font-size:15px;line-height:1;flex:none;}
  .case-h .ct{font-family:var(--font-ui);font-weight:700;font-size:12.5px;color:var(--ink);flex:1;}
  .case-h .cc{
    font-family:var(--font-mono);font-size:9.5px;color:#fff;background:var(--accent);
    padding:3px 7px;border-radius:7px;flex:none;transition:background .3s;
  }
  .info .case ol,.info .case ul{padding-left:16px;}
  .info .case li{font-size:12px;margin-bottom:5px;}
  .case .keep{
    display:flex;gap:9px;align-items:baseline;margin-top:9px;padding-top:9px;
    border-top:1px solid var(--hair);font-size:11.5px;color:var(--ink-2);line-height:1.65;
  }
  .case .keep .kk{
    font-family:var(--font-mono);font-size:9.5px;color:#fff;background:var(--ink-3);
    padding:2px 6px;border-radius:6px;flex:none;
  }
  .case .warn{
    margin:8px 0 0;padding:8px 10px;border-radius:10px;
    background:rgba(224,118,26,.1);font-size:11.5px;line-height:1.6;
  }

  /* ---- map layers sheet ---- */
  .layer-sheet[hidden],.sheet-backdrop[hidden]{display:none!important;}
  .sheet-backdrop{position:fixed;inset:0;z-index:60;background:rgba(16,26,40,.32);}
  .layer-sheet{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:61;
    width:min(440px,100%);max-height:72vh;display:flex;flex-direction:column;
    background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow-l);
    padding-bottom:calc(var(--safe-b) + 6px);
  }
  .ls-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px;}
  .ls-head h2{font-family:var(--font-ui);font-size:16px;font-weight:700;margin:0;}
  .ls-done{font-size:13px;font-weight:700;color:var(--accent);padding:6px 12px;border-radius:999px;background:var(--wash);}
  .ls-body{overflow-y:auto;padding:4px 10px 12px;}
  .lrow{width:100%;display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:14px;transition:background .15s;}
  .lrow:active{background:var(--wash);}
  .lrow .li{font-size:20px;flex:none;width:28px;text-align:center;}
  .lrow .lt{flex:1;min-width:0;}
  .lrow .lt b{display:block;font-size:14px;font-weight:700;font-family:var(--font-ui);}
  .lrow .lt span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;}
  .lsw{flex:none;width:46px;height:28px;border-radius:999px;background:rgba(22,32,46,.16);position:relative;transition:background .2s;}
  .lsw::after{
    content:"";position:absolute;top:2.5px;left:2.5px;width:23px;height:23px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(16,26,40,.3);transition:transform .2s;
  }
  .lrow.on .lsw{background:#34c759;}
  .lrow.on .lsw::after{transform:translateX(18px);}
  @media (min-width:900px){
    .layer-sheet{left:auto;right:18px;bottom:18px;transform:none;border-radius:18px;width:360px;padding-bottom:6px;}
    .sheet-backdrop{background:transparent;}
  }

  /* ================= password gate ================= */
  #gate{
    position:fixed;inset:0;z-index:3000;
    background:var(--paper);
    display:grid;place-items:center;padding:24px;
  }
  .gate-card{
    width:min(340px,92vw);background:var(--surface);

  .gate-err{color:#c0392b;font-size:12.5px;min-height:16px;margin:2px 0 0;}

    display:inline-block;padding:8px 12px;border-radius:10px;border:1px solid var(--hair);

  .doc.is-busy{opacity:.5;pointer-events:none;}
  .doc.is-err{opacity:.7;border-color:#c0392b;}

  @media (min-width:900px){
    .app{display:grid;grid-template-columns:var(--panel-w) 1fr;grid-template-rows:auto minmax(0,1fr);height:100dvh;}

    }

    .rail{padding:2px 16px 4px;}
    .panel{

      border-radius:0;box-shadow:none;background:var(--surface);
      border-right:1px solid var(--hair);touch-action:auto;

    .grip-bar,.snap-btn{display:none;}
    .p-head{padding-right:0;}
    .p-title{font-size:22px;}
    .p-body{padding:2px 22px 30px;}

  }

/* ---------------- sheet snap (mobile only) ---------------- */
function snapPx(name){
  if(name==='peek') return 176;
  if(name==='half') return Math.round(window.innerHeight*0.52);
  if(name==='full') return Math.round(window.innerHeight*0.90);
  return 176;
}
function setSnap(name, animate){
  panel.dataset.snap = name;
  snapBtn.classList.toggle('up', name==='full');
  if(isWide()){ panel.style.removeProperty('height'); return; }
  panel.classList.toggle('dragging', animate === false);
  panel.style.height = snapPx(name) + 'px';
}
function cycleSnap(){
  const order = ['peek','half','full'];
  setSnap(order[(order.indexOf(panel.dataset.snap)+1) % order.length]);
}

let dragStartY = 0, dragStartH = 0, dragging = false, moved = false;
grip.addEventListener('pointerdown', e=>{
  if(isWide()) return;
  grip.setPointerCapture(e.pointerId);
  dragging = true; moved = false;
  dragStartY = e.clientY;
  dragStartH = panel.getBoundingClientRect().height;
  panel.classList.add('dragging');
});
grip.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dy = dragStartY - e.clientY;
  if(Math.abs(dy) > 4) moved = true;
  panel.style.height = Math.max(snapPx('peek'), Math.min(snapPx('full'), dragStartH + dy)) + 'px';
});
function endDrag(){
  if(!dragging) return;
  dragging = false;
  panel.classList.remove('dragging');
  if(!moved){ cycleSnap(); return; }
  const h = panel.getBoundingClientRect().height;
  let nearest = 'half', best = Infinity;
  ['peek','half','full'].forEach(k=>{
    const diff = Math.abs(snapPx(k) - h);
    if(diff < best){ best = diff; nearest = k; }
  });
  setSnap(nearest);
}
grip.addEventListener('pointerup', endDrag);
grip.addEventListener('pointercancel', endDrag);
snapBtn.addEventListener('click', e=>{ e.stopPropagation(); cycleSnap(); });
window.addEventListener('resize', ()=>{
  setSnap(panel.dataset.snap, false);
  if(map) google.maps.event.trigger(map, 'resize');
});

// Lightweight HTML marker so we can reuse the exact .pin design on top of a real Google basemap.
// Defined lazily: google.maps only exists after the async loader fires gmapsInit.
let HtmlOverlay;
function defineHtmlOverlay(){
HtmlOverlay = class extends google.maps.OverlayView {
  constructor(position, html, anchor, opts={}){
    super();
    this.position = new google.maps.LatLng(position[0], position[1]);
    this.html = html;
    this.anchor = anchor || [0,0];
    this.onClick = opts.onClick;
    this.title = opts.title;
    this.div = null;
  }
  onAdd(){
    const div = document.createElement('div');
    div.style.position = 'absolute';
    div.innerHTML = this.html;
    if(this.title) div.title = this.title;
    if(this.onClick){
      div.style.cursor = 'pointer';
      div.addEventListener('click', this.onClick);
    }
    this.div = div;
    this.getPanes().overlayMouseTarget.appendChild(div);
  }
  draw(){
    if(!this.div) return;
    const proj = this.getProjection();
    if(!proj) return;
    const pt = proj.fromLatLngToDivPixel(this.position);
    if(pt){
      this.div.style.left = (pt.x - this.anchor[0]) + 'px';
      this.div.style.top  = (pt.y - this.anchor[1]) + 'px';
    }
  }
  onRemove(){
    if(this.div && this.div.parentNode) this.div.parentNode.removeChild(this.div);
    this.div = null;
  }
  getElement(){ return this.div; }
};
}

function drawRoute(coords, color, faint, walk){

  const path = coords.map(c=>({ lat:c[0], lng:c[1] }));

    path, strokeColor:'#ffffff', strokeOpacity:.9, strokeWeight: faint?5:(walk?6:8)
  });

  overlayList.push(halo);

  const lineOpts = {
    path, strokeColor:color,
    strokeOpacity: walk ? 0 : (faint?.55:.95),
    strokeWeight: faint?2:(walk?3:4)
  };
  if(walk){
    lineOpts.icons = [{
      icon:{ path:'M 0,-1 0,1', strokeOpacity:.95, scale:3 },
      offset:'0', repeat:'12px'
    }];
  }
  const line = new google.maps.Polyline(lineOpts);
  line.setMap(map);
  overlayList.push(line);
  return [halo, line];
}

function applyLegStyles(){
  const dim = activeLegIdx !== null;
  for(const [idx, r] of Object.entries(legRoutes)){

    const [halo, line] = r.lines;
    if(!halo || !line) continue;
    halo.setOptions({ strokeOpacity: dim && !sel ? .15 : .9, strokeWeight: sel ? (r.walk?8:10) : (r.walk?6:8), zIndex: sel ? 4 : 1 });
    if(r.walk){
      line.setOptions({ zIndex: sel ? 5 : 2, icons:[{ icon:{ path:'M 0,-1 0,1', strokeOpacity: dim && !sel ? .25 : .95, scale: sel ? 3.6 : 3 }, offset:'0', repeat:'12px' }] });
    }else{

    }
  }
}

/* ---------------- real routing via Google Directions API ---------------- */
function travelModeOf(mode){
  return mode === 'walk' ? google.maps.TravelMode.WALKING : google.maps.TravelMode.TRANSIT;
}
function fetchDirections(origin, destination, mode){
  const key = mode + ':' + origin.join(',') + '>' + destination.join(',');
  if(routeCache.has(key)) return routeCache.get(key);
  const req = {
    origin:{ lat:origin[0], lng:origin[1] },
    destination:{ lat:destination[0], lng:destination[1] },
    travelMode: travelModeOf(mode)
  };
  const p = directionsService.route(req).then(res=>{
    if(!(res.routes && res.routes[0])) throw new Error('no route');
    return res;
  }).catch(err=>{
    console.warn('Directions API 路線抓取失敗，暫用直線代替（請確認 Directions API 已啟用）：', mode, err && err.message);
    return null;
  });
  routeCache.set(key, p);
  return p;
}
function findAdjacentCoord(stops, idx, dir){
  for(let i=idx+dir; i>=0 && i<stops.length; i+=dir){
    if(stops[i].coord) return stops[i].coord;
  }
  return null;
}

function buildDayLayer(d){
  currentMarkers = {};
  const bounds = [];
  const myToken = ++layerToken;

  // 1. real route geometry per leg. Rail legs carry OSM-traced waypoints in DATA
  // (Google's APIs have no transit routing coverage in Japan); walk legs fetch
  // live WALKING directions. Everything lands in legRoutes for click-to-highlight.
  d.stops.forEach((s,i)=>{
    if(s.type !== 'transit') return;
    if(s.mode === 'rail' && s.path){
      legRoutes[i] = { lines: drawRoute(s.path, s.color, false, false), coords: s.path, walk: false };
      drawViaStations(s);
      return;
    }
    if(s.mode !== 'walk' && s.mode !== 'rail') return;
    const origin = s.from || findAdjacentCoord(d.stops, i, -1);
    const destination = s.to || findAdjacentCoord(d.stops, i, 1);
    if(!origin || !destination) return;
    fetchDirections(origin, destination, s.mode).then(res=>{
      if(myToken !== layerToken) return; // user already switched days — drop it
      const isWalk = s.mode === 'walk';
      const path = res ? res.routes[0].overview_path.map(pt=>[pt.lat(), pt.lng()]) : [origin, destination];
      legRoutes[i] = { lines: drawRoute(path, s.color, false, isWalk), coords: path, walk: isWalk };
      applyLegStyles(); // respect a highlight made before this leg resolved
    });
  });

  // 2. numbered place pins
  let order = 0;
  d.stops.forEach((s,i)=>{
    if(s.type === 'transit' || !s.coord) return;
    order++;
    const ov = new HtmlOverlay(s.coord, makePinHtml(DAY_COLORS[d.id], order, s.icon), [17,17], {
      title: s.short || s.title,
      onClick: ()=>{
        if(!isWide() && panel.dataset.snap === 'peek') setSnap('half');
        setActiveStop(i);
        scrollToStop(`stop-${d.id}-${i}`);
      }
    });
    ov.setMap(map);
    overlayList.push(ov);
    currentMarkers[i] = ov;
    bounds.push(s.coord);
  });
  return bounds;
}

function buildOverviewLayer(){
  currentMarkers = {};
  const all = [];
  DATA.filter(d=>d.stops).forEach(d=>{
    const mapped = d.stops.map((s,i)=>({...s, idx:i})).filter(s=>s.coord);
    const coords = mapped.map(s=>s.coord);
    drawRoute(coords, DAY_COLORS[d.id], true);
    mapped.forEach(s=>{
      const ov = new HtmlOverlay(s.coord, makePinHtml(DAY_COLORS[d.id], d.id, s.icon), [17,17], {
        title: `Day ${d.id} · ${s.short || s.title}`,
        onClick: ()=>{
          selectDay(d.id);
          setTimeout(()=>{ setActiveStop(s.idx); scrollToStop(`stop-${d.id}-${s.idx}`); }, 380);
        }
      });
      ov.setMap(map);
      overlayList.push(ov);
      all.push(s.coord);
    });
  });
  return all;
}

/* ---------------- render ---------------- */
function scrollToStop(id){
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({ behavior:'smooth', block:'center' });
}

function renderRail(){
  dayRail.innerHTML = '';
  DATA.forEach((d,i)=>{
    const b = document.createElement('button');
    b.className = 'station' + (d.id===activeId ? ' is-active':'') +
                  (i===0 ? ' is-first':'') + (i===DATA.length-1 ? ' is-last':'');
    b.style.setProperty('--c', colorOf(d));
    b.setAttribute('aria-current', d.id===activeId ? 'true' : 'false');
    const mark = d.isOverview ? '◎' : (d.isInfo ? 'i' : (d.isVault ? '券' : d.id));
    const label = d.isOverview ? '總覽' : (d.isInfo ? '行前準備' : d.theme);
    b.innerHTML = `<span class="seg l"></span><span class="seg r"></span>
      <span class="dot">${mark}</span><span class="st-label">${label}</span>`;
    b.addEventListener('click', ()=>selectDay(d.id));
    dayRail.appendChild(b);
  });
  const on = dayRail.querySelector('.is-active');
  if(on) on.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
}

function legHtml(s, i){
  const clickable = s.mode === 'walk' || s.mode === 'rail';
  return `
    <div class="leg${s.mode==='walk' ? ' is-walk' : ''}${s.path ? ' has-path' : ''}${clickable ? ' is-clickable' : ''}" style="--c:${s.color}" data-leg="1" data-idx="${i}"${clickable ? ' title="點擊在地圖上高亮這段路線"' : ''}>

function overviewHtml(){
  const days = DATA.filter(x=>x.stops);
  const lines = days.map(x=>`<span class="line-chip"><i style="background:${DAY_COLORS[x.id]}"></i>Day ${x.id} · ${x.theme}</span>`).join('');

}

function selectDay(id){
  activeId = id;
  const d = DATA.find(x=>x.id===id);
  document.documentElement.style.setProperty('--accent', d.color);
  renderRail();
  clearLayer();
  currentCoords = [];

  legRoutes = {};
  activeLegIdx = null;

  pEyebrow.textContent = d.isOverview ? '五天總覽' : (d.isInfo ? '出發前確認' : `${d.label} · ${d.date}`);
  pTitle.textContent = d.title;
  pNote.textContent = d.note;

  if(d.isVault){
    pBody.innerHTML = VAULT_HTML || '<div class="info"><p class="caution">憑證內容已加密，請重新整理頁面並輸入密碼解鎖。</p></div>';
    hydrateDocLinks(pBody);
    convertTimes(panel);
    setSnap('full');
    return;
  }

  if(d.isInfo){
    pBody.innerHTML = infoHtml();
    convertTimes(panel);
    setSnap('full');
    return;
  }

  if(d.isOverview){
    pBody.innerHTML = overviewHtml();
    pBody.querySelectorAll('.ov').forEach(row=>{
      row.addEventListener('click', ()=>selectDay(parseInt(row.dataset.day,10)));
    });
    currentCoords = buildOverviewLayer();
    setSnap(isWide() ? 'half' : 'peek');
    flyToCoords(currentCoords);
    return;
  }

  pBody.innerHTML =
    `<div class="weather"><span class="wi">🌤️</span><span class="wt">${d.weather.t}</span><span>${d.weather.d}</span></div>` +
    stopsHtml(d);
  pBody.querySelectorAll('.stop').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.dataset.idx,10);
      const s = d.stops[idx];
      setActiveStop(idx);
      if(s.coord) flyToCoords([s.coord]);
    });
  });
  pBody.querySelectorAll('.leg.is-clickable').forEach(el=>{

const layerBtn = document.getElementById('layerBtn');
const layerSheet = document.getElementById('layerSheet');
const layerBackdrop = document.getElementById('layerBackdrop');
const layerRows = document.getElementById('layerRows');
function renderLayerRows(){
  layerRows.innerHTML = '';
  LAYERS.forEach(l=>{
    const b = document.createElement('button');
    b.className = 'lrow' + (layerState[l.key] ? ' on' : '');
    b.setAttribute('aria-pressed', layerState[l.key]);
    b.innerHTML = `<span class="li">${l.icon}</span><span class="lt"><b>${l.label}</b><span>${l.hint}</span></span><span class="lsw"></span>`;
    b.addEventListener('click', ()=>{
      layerState[l.key] = !layerState[l.key];
      b.classList.toggle('on', layerState[l.key]);
      b.setAttribute('aria-pressed', layerState[l.key]);
      applyLayerStyles();
    });
    layerRows.appendChild(b);
  });
}
function openLayerSheet(){ renderLayerRows(); layerSheet.hidden = false; layerBackdrop.hidden = false; }
function closeLayerSheet(){ layerSheet.hidden = true; layerBackdrop.hidden = true; }
layerBtn.addEventListener('click', openLayerSheet);
layerBackdrop.addEventListener('click', closeLayerSheet);
document.getElementById('layerClose').addEventListener('click', closeLayerSheet);

/* ---------------- Taiwan / Japan time display toggle ----------------
   All times in DATA and the vault are written in their local zone: Japan
   by default, Taiwan-side ones (pickup, TPE dep/arr) marked with .tzTW.
   convertTimes() re-renders panel text in the chosen zone (JST = TWT+1). */
let tzMode = 'jp';
try{ tzMode = localStorage.getItem('tim.tz') || 'jp'; }catch(_){}
const tzBtn = document.getElementById('tzBtn');
function tzLabel(){ tzBtn.textContent = tzMode === 'jp' ? '🇯🇵 日本' : '🇹🇼 台灣'; }
tzLabel();

function convertTimes(root){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    const txt = node.nodeValue;
    if(!/\d{1,2}:\d{2}/.test(txt)) return;
    const parent = node.parentElement;
    if(!parent || parent.closest('.tconv')) return;
    const base = parent.closest('.tzTW') ? 'tw' : 'jp';
    if(base === tzMode) return;
    const delta = tzMode === 'jp' ? 1 : -1; // tw→jp +1h, jp→tw −1h
    const frag = document.createDocumentFragment();
    let last = 0, changed = false;
    for(const m of txt.matchAll(/(\d{1,2}):(\d{2})/g)){
      const h = +m[1], min = +m[2];
      if(h > 23 || min > 59) continue; // not a clock time
      frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
      const s = document.createElement('span');
      s.className = 'tconv';
      s.title = (base === 'tw' ? '台灣時間 ' : '日本時間 ') + m[0];
      s.textContent = String((h + delta + 24) % 24).padStart(2,'0') + ':' + m[2];
      frag.appendChild(s);
      last = m.index + m[0].length;
      changed = true;
    }
    if(!changed) return;
    frag.appendChild(document.createTextNode(txt.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

tzBtn.addEventListener('click', ()=>{
  tzMode = tzMode === 'jp' ? 'tw' : 'jp';
  try{ localStorage.setItem('tim.tz', tzMode); }catch(_){}
  tzLabel();
  if(typeof map !== 'undefined' && map) selectDay(activeId); // re-render times
});

let VAULT_HTML = null;
let VAULT_KEY = null;

const gate = document.getElementById('gate');
const gateForm = document.getElementById('gateForm');
const gatePw = document.getElementById('gatePw');
const gateErr = document.getElementById('gateErr');
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function vaultKeyBits(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2', salt:b64d(VAULT.salt), iterations:VAULT.iter, hash:'SHA-256'}, km, 256);
}
async function tryUnlock(rawBits){
  const key = await crypto.subtle.importKey('raw', rawBits, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(VAULT.iv)}, key, b64d(VAULT.ct));
  VAULT_HTML = new TextDecoder().decode(pt);
  VAULT_KEY = key; // same key decrypts the docs/*.bin originals
}

/* original booking PDFs, AES-GCM encrypted at docs/<id>.bin (iv[12] || ct||tag).
   Each one is fetched + decrypted once (per page load) into a blob: URL. */
const docUrlCache = new Map(); // id -> Promise<blob url>
function docUrl(id){
  if(!docUrlCache.has(id)){
    const p = (async ()=>{
      const res = await fetch('docs/' + id + '.bin');
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const buf = await res.arrayBuffer();
      const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:new Uint8Array(buf.slice(0,12))}, VAULT_KEY, buf.slice(12));
      return URL.createObjectURL(new Blob([pt], {type:'application/pdf'}));
    })();
    p.catch(()=>docUrlCache.delete(id)); // allow a retry on the next render
    docUrlCache.set(id, p);
  }
  return docUrlCache.get(id);
}
/* every [data-doc] in the vault becomes a plain <a target="_blank"> pointing at
   the decrypted PDF, so tapping it always opens a new tab (no popup blockers,
   no in-page viewer — works the same in a standalone PWA). */
function hydrateDocLinks(root){
  if(!VAULT_KEY) return;
  root.querySelectorAll('[data-doc]').forEach(el=>{
    const a = document.createElement('a');
    a.className = 'doc is-busy';
    a.innerHTML = el.innerHTML;
    a.dataset.doc = el.dataset.doc;
    a.target = '_blank';
    a.rel = 'noopener';
    el.replaceWith(a);
    docUrl(a.dataset.doc).then(url=>{
      a.href = url;
      a.classList.remove('is-busy');
    }).catch(err=>{
      a.classList.remove('is-busy');
      a.classList.add('is-err');
      a.title = '文件解密失敗：' + err.message;
      a.addEventListener('click', e=>{
        e.preventDefault();
        alert('文件開啟失敗，請確認網路後再試（' + err.message + '）');
      });
    });
  });
}

function dropGate(){
  gate.classList.add('is-out');
  setTimeout(()=>gate.remove(), 400);
}
gateForm.addEventListener('submit', async e=>{
  e.preventDefault();
  const pw = gatePw.value.trim();
  if(!pw) return;
  gateErr.textContent = '';
  try{
    const bits = await vaultKeyBits(pw);
    await tryUnlock(bits);
    try{ localStorage.setItem('tim.vk', b64e(bits)); }catch(_){}
    dropGate();
    const cur = DATA.find(x=>x.id===activeId);
    if(cur && cur.isVault) selectDay(activeId);
  }catch(_){
    gateErr.textContent = '密碼不正確，請再試一次';
    gatePw.select();
  }
});
(async ()=>{
  if(!(window.crypto && crypto.subtle)){
    gateErr.textContent = '此瀏覽環境不支援解鎖，請以 https 正式網址開啟';
    return;
  }
  const saved = localStorage.getItem('tim.vk');
  if(!saved) return;
  try{
    await tryUnlock(b64d(saved).buffer);
    dropGate();
  }catch(_){
    localStorage.removeItem('tim.vk');
  }
})();

/* offline support: service worker precaches the site + encrypted PDFs */
if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// called by the Google Maps loader once google.maps is ready (see script tag below)
function gmapsInit(){
  defineHtmlOverlay();
  initMap();
  selectDay(1);
}
